<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talhão — manejo de pragas da soja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --mata:#173A2A; --mata-2:#235239; --broto:#6FA83A; --broto-bg:#E3F0D6;
  --ambar:#E0A02A; --ambar-bg:#FBEFD3; --urucum:#C2402F; --urucum-bg:#F8DDD8;
  --nevoa:#EEF2EC; --papel:#FFFFFF; --tinta:#14211A; --tinta-2:#4B5A50; --linha:#D5DDD3;
  --terra:#7A5C44;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --nav-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Archivo",system-ui,sans-serif;font-stretch:100%;background:var(--nevoa);color:var(--tinta);font-size:16px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:6px}
.wide{font-stretch:125%}
.num{font-stretch:125%;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-stretch:118%;line-height:1.15;letter-spacing:-.015em}
h1{font-size:1.65rem;font-weight:780}
h2{font-size:1.2rem;font-weight:740}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--tinta-2)}
.small{font-size:.875rem}
.xs{font-size:.8125rem}

/* shell */
.app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:0 16px calc(var(--nav-h) + 28px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;background:var(--nevoa);z-index:20}
.farm{display:flex;flex-direction:column}
.farm b{font-stretch:120%;font-size:1.05rem;font-weight:760}
.sync{display:inline-flex;align-items:center;gap:8px;background:var(--papel);border:1px solid var(--linha);border-radius:999px;padding:8px 12px;font-size:.8125rem;min-height:40px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ambar)}
.sync.ok i{background:var(--broto)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--papel);border:1px solid var(--linha)}
.iconbtn svg{width:22px;height:22px}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--mata);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:50;border-radius:22px 22px 0 0}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#B9CDBE;font-size:.75rem;font-weight:600;min-height:56px;justify-content:center}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:#fff}
.bnav button[aria-current="page"] svg{color:var(--broto)}
.bnav .cam{position:relative;top:-18px}
.bnav .cam span.ring{width:64px;height:64px;border-radius:50%;background:var(--broto);display:grid;place-items:center;color:var(--mata);box-shadow:0 0 0 6px var(--nevoa)}
.bnav .cam span.ring svg{width:28px;height:28px;color:var(--mata)!important}
.bnav .cam[aria-current="page"] span.ring{background:#fff}

/* surfaces */
.panel{background:var(--papel);border-radius:var(--r-lg);padding:18px;border:1px solid var(--linha)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.inp input{width:100%}
section+section{margin-top:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
.link{color:var(--mata-2);font-weight:650;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:650;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.st.ok{background:var(--broto-bg);color:#3D6A1A}
.st.at{background:var(--ambar-bg);color:#865A07}
.st.cr{background:var(--urucum-bg);color:#9A2A1C}

/* hero map */
.mapcard{background:var(--mata);color:#fff;border-radius:var(--r-lg);overflow:hidden;position:relative}
.mapcard .mhead{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mapcard h1{color:#fff}
.mapcard .sub{color:#B9CDBE;font-size:.9rem}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .plot{cursor:pointer;transition:filter .15s}
.mapsvg .plot:hover{filter:brightness(1.12)}
.mapsvg .plot.sel{stroke:#fff;stroke-width:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 14px;font-size:.8125rem;color:#D3E1D6}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mapinfo{margin:0 12px 12px;background:#fff;color:var(--tinta);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r-md);padding:14px}
.kpi .num{font-size:1.5rem;display:block;line-height:1.1}
.kpi .lab{font-size:.8125rem;color:var(--tinta-2)}
.kpi.cr{border-color:#EBB3A9;background:#FFF7F5}
.kpi.at{border-color:#F0D392;background:#FFFCF3}
.kpi.money .num{color:var(--mata-2)}

/* gauge */
.gauge{position:relative;padding-top:34px;padding-bottom:30px}
.gtrack{height:18px;border-radius:9px;display:flex;overflow:hidden}
.gtrack div{height:100%}
.gmark{position:absolute;top:0;transform:translateX(-50%);transition:left 1.1s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center}
.gmark .bubble{background:var(--tinta);color:#fff;font-stretch:125%;font-weight:760;font-size:.875rem;padding:3px 9px;border-radius:8px;white-space:nowrap}
.gmark .pin{width:3px;height:30px;background:var(--tinta);border-radius:2px}
.gtick{position:absolute;bottom:0;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--tinta-2);text-align:center;line-height:1.1;white-space:nowrap}
.gtick::before{content:"";display:block;width:2px;height:8px;background:var(--tinta-2);margin:0 auto 2px}
@media (prefers-reduced-motion:reduce){.gmark{transition:none}*{animation:none!important}}

/* decision banner */
.verdict{border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict.cr{background:var(--urucum);color:#fff}
.verdict.at{background:var(--ambar);color:#2B1D02}
.verdict.ok{background:var(--broto);color:#122708}
.verdict h2{font-size:1.35rem}
.verdict p{font-size:.95rem}

/* list */
.list{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:64px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--linha)}
button.li:hover{background:#F6F8F5}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:680}
.swatch{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-stretch:125%;font-weight:780;font-size:.85rem}
.chev{width:20px;height:20px;color:var(--tinta-2);flex-shrink:0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.875rem;font-weight:650}
.field .hint{font-size:.78rem;color:var(--tinta-2)}
.inp{display:flex;align-items:center;background:var(--nevoa);border:1.5px solid var(--linha);border-radius:12px;min-height:48px;padding:0 12px;gap:6px}
.inp:focus-within{border-color:var(--mata-2);background:#fff}
.inp input,.inp select{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;height:46px}
.inp span{color:var(--tinta-2);font-size:.85rem;white-space:nowrap}
.btn{min-height:50px;border-radius:14px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1rem}
.btn.pri{background:var(--mata);color:#fff}
.btn.pri:hover{background:var(--mata-2)}
.btn.sec{background:var(--papel);border:1.5px solid var(--mata);color:var(--mata)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.seg{display:flex;background:var(--nevoa);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--linha)}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:650;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--mata);color:#fff}
details summary{cursor:pointer;font-weight:650;min-height:44px;display:flex;align-items:center;color:var(--mata-2)}

/* scenarios */
.scen{border:2px solid var(--linha);border-radius:var(--r-md);padding:14px;background:#fff;position:relative}
.scen.best{border-color:var(--mata)}
.scen .tag{position:absolute;top:-11px;right:12px;background:var(--mata);color:#fff;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px}
.scen dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.875rem;margin-top:8px}
.scen dt{color:var(--tinta-2)}
.scen dd{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:10px;border-radius:5px;background:var(--nevoa);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}

/* camera */
.viewfinder{aspect-ratio:3/4;max-height:58vh;width:100%;border-radius:var(--r-lg);background:#0E1F16;position:relative;overflow:hidden;display:grid;place-items:center;color:#B9CDBE}
.viewfinder img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.viewfinder svg.ill{width:72%;height:auto;position:relative}
.vf-c{position:absolute;width:38px;height:38px;border-color:#fff;border-style:solid;opacity:.9}
.vf-c.a{top:16px;left:16px;border-width:3px 0 0 3px;border-radius:8px 0 0 0}
.vf-c.b{top:16px;right:16px;border-width:3px 3px 0 0;border-radius:0 8px 0 0}
.vf-c.c{bottom:16px;left:16px;border-width:0 0 3px 3px;border-radius:0 0 0 8px}
.vf-c.d{bottom:16px;right:16px;border-width:0 3px 3px 0;border-radius:0 0 8px 0}
.scanline{position:absolute;left:8%;right:8%;height:2px;background:var(--broto);box-shadow:0 0 18px 4px rgba(111,168,58,.7);top:10%;animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
.vf-msg{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-weight:650;font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linha);background:#fff;font-weight:600;font-size:.875rem}
.chip:hover{border-color:var(--mata-2)}
.conf{height:12px;border-radius:6px;background:var(--nevoa);overflow:hidden}
.conf i{display:block;height:100%;border-radius:6px}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stages div{text-align:center;font-size:.72rem;line-height:1.2;color:var(--tinta-2);padding:8px 2px 6px;border-radius:10px;background:var(--nevoa)}
.stages div svg{width:26px;height:26px;display:block;margin:0 auto 4px;color:var(--terra)}
.stages div.on{background:var(--mata);color:#fff;font-weight:700}
.stages div.on svg{color:var(--broto)}
.note{background:var(--nevoa);border-left:4px solid var(--mata-2);padding:12px 14px;border-radius:0 12px 12px 0;font-size:.9rem}
.note.warn{border-color:var(--ambar);background:var(--ambar-bg)}
ul.clean{list-style:none}
ul.clean li{padding-left:18px;position:relative;font-size:.92rem}
ul.clean li+li{margin-top:5px}
ul.clean li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--broto)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:"Archivo",sans-serif;font-size:11px;fill:var(--tinta-2)}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(14,31,22,.45);z-index:80;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--nevoa);border-radius:24px 24px 0 0;z-index:90;padding:10px 16px 32px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.scrim.open{display:block}
.grab{width:44px;height:5px;border-radius:3px;background:#B9C6BC;margin:4px auto 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;z-index:100;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* desktop */
@media (min-width:960px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;width:244px;background:var(--mata);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;gap:4px;flex-shrink:0}
  .side .brand{font-stretch:125%;font-weight:800;font-size:1.35rem;padding:0 12px 22px;display:flex;align-items:center;gap:10px}
  .side .brand svg{width:30px;height:30px;color:var(--broto)}
  .side button{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:48px;border-radius:12px;color:#C9D9CD;font-weight:600;text-align:left}
  .side button svg{width:22px;height:22px}
  .side button:hover{background:rgba(255,255,255,.07)}
  .side button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  .side button[aria-current="page"] svg{color:var(--broto)}
  .side .foot{margin-top:auto;font-size:.8rem;color:#9FB7A6;padding:0 12px}
  main{padding:0 36px 48px;max-width:1240px}
  .dash{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
  .dash section+section{margin-top:0}
  .dash .span2{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .two section+section{margin-top:0}
  .sheet{left:auto;right:24px;bottom:24px;top:24px;width:460px;max-height:none;border-radius:24px;transform:translateX(110%)}
  .toast{bottom:28px}
  .viewfinder{max-height:70vh}
}
</style>
</head>

</svg>

<div class="app">
  <nav class="side" aria-label="Navegação principal">
    <div class="brand"><svg><use href="#i-leaf"/></svg>Talhão</div>
    <button data-go="inicio"><svg><use href="#i-home"/></svg>Início</button>
    <button data-go="talhoes"><svg><use href="#i-plots"/></svg>Talhões</button>
    <button data-go="identificar"><svg><use href="#i-cam"/></svg>Identificar</button>
    <button data-go="decisao"><svg><use href="#i-scale"/></svg>Decisão</button>
    <button data-go="alertas"><svg><use href="#i-bell"/></svg>Alertas</button>
    <button data-go="guia"><svg><use href="#i-book"/></svg>Guia MIP</button>
    <p class="foot">Protótipo para a palestra de Agronomia. Dados de exemplo.</p>
  </nav>

  <main>
    <header class="topbar">
      <div class="farm">
        <b>Fazenda Santa Rita</b>
        <span class="xs muted">Soja, safra 2026/27, Cascavel-PR</span>
      </div>
      <div class="row" style="gap:8px">
        <button class="sync" id="syncBtn" aria-live="polite"><i></i><span id="syncTxt">3 para sincronizar</span></button>
        <button class="iconbtn" data-go="guia" aria-label="Abrir guia MIP"><svg><use href="#i-book"/></svg></button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<nav class="bnav" aria-label="Navegação principal">
  <button data-go="inicio"><svg><use href="#i-home"/></svg>Início</button>
  <button data-go="talhoes"><svg><use href="#i-plots"/></svg>Talhões</button>
  <button data-go="identificar" class="cam" aria-label="Identificar praga ou doença"><span class="ring"><svg><use href="#i-cam"/></svg></span></button>
  <button data-go="decisao"><svg><use href="#i-scale"/></svg>Decisão</button>
  <button data-go="alertas"><svg><use href="#i-bell"/></svg>Alertas</button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside>

const PRAGAS={

    danos:["Desfolha intensa, consumindo a folha inteira inclusive nervuras","Em surtos, pode desfolhar a lavoura em poucos dias"],

    carac:["Cabeça escura com 'Y' invertido claro","Quatro pontos escuros em quadrado no penúltimo segmento","Pode atacar vagens"],

    danos:["Desfolha precoce e enchimento de grãos incompleto","Perdas que podem passar de 70% sem controle"],

const TALHOES=[

  {id:"T2",nome:"Baixada",ha:38,var:"NS 6601",plantio:"2026-09-24",estadio:"V8",status:"at",praga:"chrysodeixis",pop:14,hist:[3,5,8,11,14],pts:"140,92 128,14 224,10 236,84"},
  {id:"T3",nome:"Cerca Viva",ha:55,var:"BMX Zeus",plantio:"2026-09-30",estadio:"V5",status:"ok",praga:"anticarsia",pop:4,hist:[2,2,3,4,4],pts:"224,10 344,18 338,96 236,84"},
  {id:"T4",nome:"Açude",ha:31,var:"TMG 7062",plantio:"2026-09-20",estadio:"V9",status:"cr",praga:"anticarsia",pop:24,hist:[4,8,13,19,24],pts:"26,104 140,92 150,176 34,190"},

   just:"14 lagartas grandes por pano, 70% do nível de controle. No ritmo atual, deve passar de 20 em 4 a 5 dias. Reavalie até sexta."},

];

/* ---------- UTIL ---------- */
const $=s=>document.querySelector(s);

const tal=id=>TALHOES.find(t=>t.id===id);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- GRÁFICOS SVG ---------- */
function lineChart(series,labels,{nc,ne,max,h=170}={}){
  const W=340,H=h,p={l:28,r:10,t:12,b:24};const iw=W-p.l-p.r,ih=H-p.t-p.b;
  max=max||Math.max(...series.flatMap(s=>s.v),nc||0)*1.15;
  const x=i=>p.l+i*(iw/(labels.length-1)),y=v=>p.t+ih-(v/max)*ih;
  let g="";for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E9E1"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`);
  if(nc)g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(nc)}" y2="${y(nc)}" stroke="${COLORS.cr}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-p.r}" y="${y(nc)-5}" text-anchor="end" style="fill:${COLORS.cr};font-weight:700">NC ${nc}</text>`;
  if(ne)g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(ne)}" y2="${y(ne)}" stroke="${COLORS.ok}" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${W-p.r}" y="${y(ne)-5}" text-anchor="end" style="fill:#3D6A1A;font-weight:700">NE ${ne}</text>`;
  series.forEach(s=>{const d=s.v.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join("");
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.v.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.v.length-1?4.5:3}" fill="${s.c}"><title>${s.n}: ${v} em ${labels[i]}</title></circle>`)});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">${g}</svg></div>`;
}
function hbars(items,{unit="",max}={}){
  max=max||Math.max(...items.map(i=>i.v))*1.1;
  return `<div class="stack" style="--g:8px">${items.map(i=>`<div><div class="row between small"><span>${i.l}</span><b class="num" style="font-size:.9rem">${i.f||fmt(i.v)}${unit}</b></div><div class="bar"><i style="width:${Math.max(2,i.v/max*100)}%;background:${i.c}"></i></div></div>`).join("")}</div>`;
}

/* ---------- MAPA ---------- */
let mapSel="T4";
function farmMap(){
  const plots=TALHOES.map(t=>{const c=t.pts.split(" ").map(p=>p.split(",").map(Number));const cx=c.reduce((a,b)=>a+b[0],0)/c.length,cy=c.reduce((a,b)=>a+b[1],0)/c.length;
    const fill={ok:"#4F8A2E",at:"#C98D1E",cr:"#B13A2A"}[t.status];
    let dots="";const n=t.status==="cr"?6:t.status==="at"?4:2;for(let k=0;k<n;k++){const a=k*2.3,r=10+k*3;dots+=`<circle cx="${cx+Math.cos(a)*r*1.4}" cy="${cy+14+Math.sin(a)*r*.4}" r="2.2" fill="#fff" opacity=".85"/>`}
    let rows="";for(let k=-60;k<60;k+=7)rows+=`<line x1="${cx-70}" y1="${cy+k}" x2="${cx+70}" y2="${cy+k-24}" stroke="rgba(0,0,0,.13)" stroke-width="1.4"/>`;
    return `<g><clipPath id="c${t.id}"><polygon points="${t.pts}"/></clipPath>
      <polygon class="plot ${t.id===mapSel?"sel":""}" data-plot="${t.id}" points="${t.pts}" fill="${fill}" stroke="#173A2A" stroke-width="2" tabindex="0" role="button" aria-label="Talhão ${t.id} ${t.nome}, ${stLabel[t.status]}"/>
      <g clip-path="url(#c${t.id})" pointer-events="none">${rows}</g>
      <g pointer-events="none">${dots}<text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#fff" style="font:800 15px Archivo,system-ui,sans-serif;font-stretch:125%">${t.id}</text></g></g>`}).join("");
  return `<svg class="mapsvg" viewBox="0 0 360 210" aria-label="Mapa dos talhões da fazenda">
    <path d="M0 200 C 60 192, 120 186, 180 190 S 300 198, 360 190" stroke="#C9B48F" stroke-width="7" fill="none" opacity=".55"/>
    <ellipse cx="18" cy="160" rx="16" ry="26" fill="#3E7E9B" opacity=".75"/>
    ${plots}</svg>`;
}
function mapInfo(){const t=tal(mapSel),p=PRAGAS[t.praga];
  return `<div><div class="row" style="gap:8px"><b class="wide">${t.id} ${t.nome}</b><span class="st ${t.status}">${stLabel[t.status]}</span></div>
  <div class="small muted">${p.nome}: ${t.pop} ${p.tipo==="doenca"?"% folhas":"por pano"}, ${t.ha} ha, ${t.estadio}</div></div>
  <button class="iconbtn" data-open="${t.id}" aria-label="Ver detalhes do talhão ${t.id}"><svg class="chev"><use href="#i-chev"/></svg></button>`}

/* ---------- TELAS ---------- */
const V={};
V.inicio=()=>{
  const totHa=TALHOES.reduce((a,t)=>a+t.ha,0);
  const cr=TALHOES.filter(t=>t.status==="cr"),at=TALHOES.filter(t=>t.status==="at");
  const custo=cr.reduce((a,t)=>a+t.ha*165,0);
  const evit=cr.reduce((a,t)=>a+t.ha*calcLoss(t.pop),0);
  return `<div class="dash">
  <section>
    <div class="mapcard">
      <div class="mhead"><div><h1>1 talhão precisa de controle hoje</h1><p class="sub">Toque em um talhão para ver a situação</p></div></div>
      ${farmMap()}
      <div class="legend"><span><i style="background:#4F8A2E"></i>Sob controle</span><span><i style="background:#C98D1E"></i>Atenção</span><span><i style="background:#B13A2A"></i>Agir agora</span><span><i style="background:#fff;border-radius:50%;width:8px;height:8px"></i>Ponto amostrado</span></div>
      <div class="mapinfo" id="mapinfo">${mapInfo()}</div>
    </div>
  </section>
  <section>
    <div class="kpis">
      <div class="kpi"><span class="num">${totHa}</span><span class="lab">hectares monitorados</span></div>
      <div class="kpi"><span class="num">${TALHOES.length}</span><span class="lab">talhões cadastrados</span></div>
      <div class="kpi"><span class="num">3</span><span class="lab">pragas identificadas</span></div>
      <div class="kpi"><span class="num">1</span><span class="lab">doença suspeita</span></div>
      <div class="kpi at"><span class="num">${at.length}</span><span class="lab">áreas em atenção</span></div>
      <div class="kpi cr"><span class="num">${cr.length}</span><span class="lab">avaliação imediata</span></div>
      <div class="kpi money"><span class="num">${brl(custo)}</span><span class="lab">custo estimado de controle</span></div>
      <div class="kpi money"><span class="num">${brl(evit)}</span><span class="lab">prejuízo evitável</span></div>
    </div>
  </section>
  <section class="panel">
    <div class="sechead"><h2>Lagartas por pano de batida</h2><button class="link" data-go="guia">O que é NC?</button></div>
    ${lineChart([{n:"T4 Açude",v:tal("T4").hist,c:COLORS.cr},{n:"T2 Baixada",v:tal("T2").hist,c:COLORS.at},{n:"T1 Sede",v:tal("T1").hist,c:COLORS.ok}],DATAS,{nc:20,ne:6,max:28})}
    <div class="row small" style="gap:14px;flex-wrap:wrap;margin-top:6px"><span><b style="color:${COLORS.cr}">━</b> T4 Açude</span><span><b style="color:${COLORS.at}">━</b> T2 Baixada</span><span><b style="color:${COLORS.ok}">━</b> T1 Sede</span></div>
  </section>
  <section class="panel">
    <div class="sechead"><h2>Infestação por talhão</h2><span class="xs muted">% do nível de controle</span></div>
    ${hbars(TALHOES.map(t=>({l:`${t.id} ${t.nome}`,v:Math.round(t.pop/PRAGAS[t.praga].NC*100),c:COLORS[t.status]})),{unit:"%",max:130})}
  </section>
  <section class="panel">
    <div class="sechead"><h2>Principais ocorrências</h2></div>
    ${hbars([{l:"Lagarta-da-soja",v:4,f:"4 talhões",c:"#235239"},{l:"Falsa-medideira",v:1,f:"1 talhão",c:"#235239"},{l:"Ferrugem-asiática",v:1,f:"1 talhão",c:"#7A5C44"}],{max:6})}
  </section>
  <section class="panel">
    <div class="sechead"><h2>Histórico de aplicações</h2></div>
    <div>${APLICACOES.map(a=>`<div class="row between small" style="padding:8px 0;border-bottom:1px solid var(--linha)"><span><b>${a.data}</b> ${a.talhao}, ${a.prod}</span><b class="num" style="font-size:.9rem">${brl(a.custo)}/ha</b></div>`).join("")}</div>
  </section>
  </div>`;
};
V.talhoes=()=>`<div class="sechead"><h1>Talhões</h1><button class="btn sec" id="addT" style="min-height:44px">Novo talhão</button></div>
  <p class="muted small" style="margin-bottom:14px">${TALHOES.length} talhões, ${TALHOES.reduce((a,t)=>a+t.ha,0)} ha de soja. Toque para ver histórico.</p>
  <div class="list">${TALHOES.map(t=>{const p=PRAGAS[t.praga];return `<button class="li" data-open="${t.id}">
    <span class="swatch" style="background:${{ok:"var(--broto-bg)",at:"var(--ambar-bg)",cr:"var(--urucum-bg)"}[t.status]};color:${{ok:"#3D6A1A",at:"#865A07",cr:"#9A2A1C"}[t.status]}">${t.id}</span>
    <span class="grow"><span class="t">${t.nome}</span> <span class="xs muted">${t.ha} ha, ${t.estadio}, ${t.var}</span><br><span class="small muted">${p.nome}: ${t.pop} ${p.tipo==="doenca"?"% folhas":"por pano"}</span></span>
    <span class="st ${t.status}">${stLabel[t.status]}</span><svg class="chev"><use href="#i-chev"/></svg></button>`}).join("")}</div>
  <section class="panel" style="margin-top:22px"><div class="sechead"><h2>Registros recentes</h2><span class="xs muted">${pendentes} aguardando sinal</span></div>
  ${REGISTROS.map(r=>`<div class="row between small" style="padding:9px 0;border-bottom:1px solid var(--linha)"><span><b>${r.data}</b> ${r.talhao}, ${r.o} <span class="muted">(${r.est})</span></span><b>${r.q}</b></div>`).join("")}</section>`;

/* --- identificar --- */
let idState={modo:"praga",fase:"pronto",foto:null,res:null};
const AMOSTRAS={praga:[["anticarsia","Lagarta verde com listras"],["chrysodeixis","Lagarta que anda medindo palmo"],["baixa","Foto escura ou tremida"]],doenca:[["ferrugem","Folha com pontinhos marrons"],["baixa","Folha de longe, sem foco"]]};
const ILL={
  anticarsia:`<svg class="ill" viewBox="0 0 200 120"><path d="M20 70 Q60 20 110 60 T190 60" stroke="#5E8F3A" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M20 70 Q60 20 110 60 T190 60" stroke="#EAF3DC" stroke-width="3" fill="none" stroke-dasharray="2 0" transform="translate(0,-5)"/><path d="M20 70 Q60 20 110 60 T190 60" stroke="#EAF3DC" stroke-width="2" fill="none" transform="translate(0,5)"/><circle cx="190" cy="60" r="12" fill="#3F6B28"/></svg>`,
  chrysodeixis:`<svg class="ill" viewBox="0 0 200 120"><path d="M20 90 L60 90 Q80 30 110 90 L180 90" stroke="#9CC46A" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 90 L60 90 Q80 30 110 90 L180 90" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/><circle cx="182" cy="88" r="9" fill="#7FAA4E"/></svg>`,
  ferrugem:`<svg class="ill" viewBox="0 0 200 140"><path d="M100 10 C170 30 185 100 100 130 C15 100 30 30 100 10z" fill="#7FA650"/><path d="M100 14 V128" stroke="#5D7F38" stroke-width="2"/>${Array.from({length:26},(_,i)=>`<circle cx="${60+((i*37)%80)}" cy="${40+((i*53)%80)}" r="${2+(i%3)}" fill="#8A4A22"/>`).join("")}</svg>`,
  baixa:`<svg class="ill" viewBox="0 0 200 120"><rect x="20" y="20" width="160" height="80" rx="12" fill="#2A3A30"/><path d="M40 80 Q80 40 120 70 T170 60" stroke="#55705A" stroke-width="14" fill="none" filter="blur(3px)"/></svg>`
};
const STAGES=[["s-egg","Ovo"],["s-l1","Lagarta jovem"],["s-l2","Em desenv."],["s-l3","Avançada"],["s-pupa","Pupa"],["s-moth","Mariposa"]];
function resultado(key){
  if(key==="baixa")return {baixa:true,conf:38};
  const p=PRAGAS[key];
  const base={anticarsia:{conf:91,stage:3,est:"Lagarta grande, cerca de 3 cm (5º ínstar)",nivel:"Alto: equivale a cerca de 24 por pano no ponto fotografado"},
    chrysodeixis:{conf:84,stage:2,est:"Lagarta média, cerca de 2 cm (3º ínstar)",nivel:"Moderado: compatível com 12 a 15 por pano"},
    ferrugem:{conf:71,stage:-1,est:"Fase inicial: lesões pequenas, sem coalescer",nivel:"Baixo: cerca de 1% das folhas do terço inferior"}}[key];
  return {key,...p,...base};
}
V.identificar=()=>{
  const s=idState;
  let vf;
  if(s.fase==="analisando")vf=`<div class="viewfinder">${s.foto?`<img src="${s.foto}" alt="Foto enviada">`:ILL[s.res]}<span class="vf-c a"></span><span class="vf-c b"></span><span class="vf-c c"></span><span class="vf-c d"></span><div class="scanline"></div><p class="vf-msg">Analisando a imagem…</p></div>`;
  else if(s.fase==="resultado")vf="";
  else vf=`<div class="viewfinder"><span class="vf-c a"></span><span class="vf-c b"></span><span class="vf-c c"></span><span class="vf-c d"></span>
    <div style="text-align:center;padding:24px;position:relative"><svg style="width:56px;height:56px;color:var(--broto)"><use href="#i-cam"/></svg>
    <p style="color:#fff;font-weight:700;margin-top:8px">${s.modo==="praga"?"Enquadre a lagarta sobre a folha":"Enquadre a folha com sintomas"}</p>
    <p class="small" style="margin-top:4px">${s.modo==="praga"?"Chegue a um palmo de distância, com luz natural":"Fotografe a face de baixo da folha, contra a luz"}</p></div></div>`;
  if(s.fase==="resultado")return V.idResult();
  return `<h1 style="margin-bottom:12px">Identificar</h1>
  <div class="two"><section>
  <div class="seg" role="group" aria-label="O que identificar" style="margin-bottom:12px">
    <button aria-pressed="${s.modo==="praga"}" data-modo="praga">Praga</button><button aria-pressed="${s.modo==="doenca"}" data-modo="doenca">Doença</button></div>
  ${vf}
  </section><section class="stack" style="margin-top:14px">
  <label class="btn pri block" for="foto" style="cursor:pointer"><svg><use href="#i-cam"/></svg>Tirar ou enviar foto</label>
  <input id="foto" type="file" accept="image/*" capture="environment" hidden>
  <div><p class="small" style="font-weight:650;margin-bottom:8px">Sem lagarta por perto? Teste com um exemplo:</p>
  <div class="chips">${AMOSTRAS[s.modo].map(([k,l])=>`<button class="chip" data-amostra="${k}">${l}</button>`).join("")}</div></div>
  <p class="note small">Protótipo: a identificação aqui é simulada. Na versão final, um modelo treinado com fotos de campo faz a análise e funciona sem internet.</p>
  </section></div>`;
};
V.idResult=()=>{
  const r=resultado(idState.res);
  if(r.baixa)return `<h1 style="margin-bottom:12px">Não deu para identificar</h1>
    <div class="panel stack"><div><div class="row between small"><b>Confiança</b><b class="num">${r.conf}%</b></div><div class="conf" style="margin-top:6px"><i style="width:${r.conf}%;background:var(--urucum)"></i></div></div>
    <p>A imagem está escura ou fora de foco, então qualquer diagnóstico seria um chute. Tire outra foto:</p>
    <ul class="clean"><li>Aproxime a um palmo do inseto ou da lesão</li><li>Use luz natural, sem sombra do próprio corpo</li><li>Toque na tela para focar antes de fotografar</li></ul>
    <p class="note warn small">Se a dúvida continuar, leve uma amostra para avaliação de um agrônomo.</p>
    <button class="btn pri block" data-reset>Tirar outra foto</button></div>`;
  const cor=r.conf>=80?"var(--broto)":r.conf>=60?"var(--ambar)":"var(--urucum)";
  const t=tal(r.key==="ferrugem"?"T5":r.key==="chrysodeixis"?"T2":"T4");
  return `<div class="row between" style="margin-bottom:12px"><h1>Resultado</h1><button class="link" data-reset>Nova foto</button></div>
  <div class="two"><section class="stack">
  <div class="panel stack">
    <div><p class="xs muted">${r.tipo==="praga"?"Praga provável":"Doença provável"}</p><h2 style="font-size:1.5rem">${r.nome}</h2><p class="muted"><i>${r.cient}</i></p></div>
    <div><div class="row between small"><b>Confiança da identificação</b><b class="num">${r.conf}%</b></div><div class="conf" style="margin-top:6px"><i style="width:${r.conf}%;background:${cor}"></i></div>
    ${r.conf<80?`<p class="xs muted" style="margin-top:6px">Confiança moderada. Confirme em campo antes de decidir.</p>`:""}</div>
    ${r.stage>=0?`<div><p class="small" style="font-weight:650;margin-bottom:8px">Estágio: ${r.est}</p><div class="stages">${STAGES.map(([ic,l],i)=>`<div class="${i===r.stage?"on":""}"><svg><use href="#${ic}"/></svg>${l}</div>`).join("")}</div>
    <p class="xs muted" style="margin-top:8px">Lagartas grandes comem até 90% de toda a folha que vão consumir na vida. Pequenas são mais fáceis de controlar, grandes causam o estrago.</p></div>`:`<p class="small"><b>Estágio:</b> ${r.est}</p>`}
    <p class="small"><b>Nível estimado:</b> ${r.nivel}</p>
  </div>
  <div class="panel"><h3 style="margin-bottom:8px">Como confirmar em campo</h3>
  ${r.tipo==="praga"?`<ul class="clean"><li>Faça o pano de batida: estenda o pano entre duas fileiras e sacuda vigorosamente 1 metro de plantas</li><li>Conte só lagartas com mais de 1,5 cm</li><li>Repita em pelo menos 1 ponto a cada 10 ha e use a média</li></ul>`:`<ul class="clean"><li>Colete folhas do terço inferior em 10 pontos do talhão</li><li>Olhe a face de baixo com lupa de 20x, procurando pústulas salientes</li><li>Na dúvida, envie amostra para laboratório credenciado</li></ul>`}</div>
  </section><section class="stack">
  <div class="panel"><h3 style="margin-bottom:8px">Características que levaram a esse resultado</h3><ul class="clean">${r.carac.map(c=>`<li>${c}</li>`).join("")}</ul></div>
  <div class="panel"><h3 style="margin-bottom:8px">Danos e sintomas</h3><ul class="clean">${[...r.danos,...r.sint].map(c=>`<li>${c}</li>`).join("")}</ul></div>
  <div class="note small"><b>Referência técnica:</b> ${r.ref}</div>
  <button class="btn pri block" data-registrar="${t.id}">Registrar no ${t.id} ${t.nome}</button>
  ${r.tipo==="praga"?`<button class="btn sec block" data-simular="${r.key}">Simular se compensa aplicar</button>`:""}
  </section></div>`;
};

/* --- decisão --- */
let D={praga:"anticarsia",areaTotal:242,areaAf:31,pop:24,estadio:"veg",preco:128,prod:62,produto:88,aplic:42,oper:35,k:0.09,ef:85,cresc:7};
function calcLoss(pop){return D.prod*Math.min(pop*D.k/100,.6)*D.preco}
function calc(){
  const p=PRAGAS[D.praga];
  const custoHa=D.produto+D.aplic+D.oper, custoTot=custoHa*D.areaAf;
  const ef=D.ef/100, k=D.k/100;
  const perdaPct=Math.min(D.pop*k,.6), perdaSc=D.prod*perdaPct, prejHa=perdaSc*D.preco, prejTot=prejHa*D.areaAf;
  const receita=D.prod*D.preco*D.areaTotal;
  const NDE=custoHa/(D.preco*D.prod*k*ef);
  const ncRef=p.NC*(D.estadio==="rep"?.75:1);
  const NC=Math.min(ncRef,NDE*.85);
  const NE=p.NE;
  const pop7=D.pop*Math.pow(1+D.cresc/100,7), prej7=D.prod*Math.min(pop7*k,.6)*D.preco*D.areaAf;
  const pop4=D.pop*Math.pow(1+D.cresc/100,4);
  const s1={custo:0,perda:prej7,total:prej7};
  const s2={custo:custoTot,perda:prej7*(1-ef),total:custoTot+prej7*(1-ef),ret:prej7*ef-custoTot};
  const custoAval=6*D.areaAf;
  const s3={custo:custoAval,perda:prejTot*.35,total:custoAval+prejTot*.35,pop4};
  let best,veredito,cls;
  if(D.pop>=NC&&s2.ret>0){best=2;cls="cr";veredito={t:"Aplicar agora",d:`A população (${fmt(D.pop)}) passou do nível de controle (${fmt(NC,1)}). Cada R$ 1 investido protege cerca de R$ ${fmt((prej7*ef)/custoTot,2)} da produção na próxima semana.`}}
  else if(D.pop>=NC*.6){best=3;cls="at";veredito={t:"Reavaliar em 3 dias",d:`Está em ${Math.round(D.pop/NC*100)}% do nível de controle. No ritmo atual, chega a ${fmt(pop4,0)} em 4 dias${pop4>=NC?", passando do limite":""}. Ainda não compensa aplicar.`}}
  else{best=3;cls="ok";veredito={t:"Não aplicar, seguir monitorando",d:`Abaixo do nível de controle. Deixar de aplicar economiza ${brl(custoTot)} nesta área e preserva inimigos naturais.`}}
  return {prej7,p,custoHa,custoTot,perdaPct,perdaSc,prejHa,prejTot,receita,NDE,NC,ncRef,NE,s1,s2,s3,best,veredito,cls,pop7,pop4};
}
function gauge(c,anim){
  const max=Math.max(40,c.NDE*1.3,D.pop*1.15);
  const pc=v=>Math.min(100,v/max*100);
  const pos=anim?0:pc(D.pop);
  return `<div class="gauge" id="gauge"><div class="gmark" id="gmark" style="left:${pos}%"><span class="bubble">${fmt(D.pop)} hoje</span><span class="pin"></span></div>
  <div class="gtrack"><div style="width:${pc(c.NE)}%;background:#A6CF7D"></div><div style="width:${pc(c.NC)-pc(c.NE)}%;background:#E8C26A"></div><div style="width:${pc(c.NDE)-pc(c.NC)}%;background:#E0884F"></div><div style="flex:1;background:#C2402F"></div></div>
  <span class="gtick" style="left:${pc(c.NE)}%">NE<br>${fmt(c.NE)}</span><span class="gtick" style="left:${pc(c.NC)}%">NC<br>${fmt(c.NC,1)}</span><span class="gtick" style="left:${pc(c.NDE)}%">NDE<br>${fmt(c.NDE,1)}</span></div>`;
}
function inp(id,label,unit,hint,step=1){return `<div class="field"><label for="d-${id}">${label}</label><div class="inp"><input id="d-${id}" data-d="${id}" type="number" inputmode="decimal" step="${step}" value="${D[id]}"><span>${unit}</span></div>${hint?`<span class="hint">${hint}</span>`:""}</div>`}
V.decisao=(anim=true)=>{
  const c=calc();
  const sc=[["Não controlar",c.s1,1,`Pode chegar a ${fmt(c.pop7)} ${c.p.tipo==="doenca"?"%":"por pano"} em 7 dias`],["Controlar agora",c.s2,2,c.s2.ret>0?`Retorno líquido de ${brl(c.s2.ret)}`:`Gasta ${brl(-c.s2.ret)} a mais do que salva`],["Seguir monitorando",c.s3,3,`Nova avaliação em 3 dias, ${fmt(c.pop4)} previstas`]];
  const maxT=Math.max(...sc.map(s=>s[1].total));
  return `<h1 style="margin-bottom:4px">Vale a pena aplicar?</h1><p class="muted small" style="margin-bottom:14px">Compara o custo do controle com o prejuízo que a praga causa.</p>
  <div class="two"><section class="stack">
    <div class="verdict ${c.cls}" aria-live="polite"><h2>${c.veredito.t}</h2><p>${c.veredito.d}</p></div>
    <div class="panel"><div class="sechead"><h3>Régua do manejo, ${c.p.unid}</h3></div>${gauge(c,anim)}
    <p class="xs muted" style="margin-top:10px">NE e NC vêm da referência técnica da praga${c.NC<c.ncRef?"; o NC foi antecipado porque, com estes preços, o dano econômico começa cedo":""}${D.estadio==="rep"?"; reduzido 25% no reprodutivo":""}. O NDE é calculado com os seus custos.</p></div>
    <div class="stack">${sc.map(([n,s,i,obs])=>`<div class="scen ${c.best===i?"best":""}">${c.best===i?'<span class="tag">Melhor opção</span>':""}
      <div class="row between"><h3>${n}</h3><b class="num">${brl(s.total)}</b></div><p class="xs muted">${obs}</p>
      <div class="bar"><i style="width:${s.custo/maxT*100}%;background:var(--mata-2)"></i><i style="width:${s.perda/maxT*100}%;background:var(--urucum)"></i></div>
      <dl><dt>Custo de controle</dt><dd>${brl(s.custo)}</dd><dt>Perda de produção estimada</dt><dd>${brl(s.perda)}</dd></dl></div>`).join("")}
      <p class="xs muted"><b style="color:var(--mata-2)">■</b> custo &nbsp; <b style="color:var(--urucum)">■</b> perda. A melhor opção segue o nível de controle: acima dele, esperar deixa a praga crescer e o dano vira irreversível.</p></div>
    <div class="panel"><h3 style="margin-bottom:8px">Números da área</h3>
      <div class="scen" style="border:0;padding:0"><dl>
      <dt>Custo do controle</dt><dd>${brl(c.custoTot)}</dd><dt>Custo por hectare</dt><dd>${brl(c.custoHa)}</dd>
      <dt>Área afetada</dt><dd>${fmt(D.areaAf/D.areaTotal*100,1)}% da lavoura</dd>
      <dt>Prejuízo sem controle (7 dias)</dt><dd>${brl(c.prej7)}</dd><dt>Produtividade em risco</dt><dd>${fmt(c.perdaSc,1)} sc/ha</dd>
      <dt>Receita estimada da safra</dt><dd>${brl(c.receita)}</dd>
      <dt>Retorno da aplicação</dt><dd style="color:${c.s2.ret>0?"#3D6A1A":"#9A2A1C"}">${brl(c.s2.ret)}</dd>
      <dt>Economia se não aplicar</dt><dd>${D.pop<c.NC?brl(c.custoTot):"não recomendado"}</dd></dl></div></div>
  </section>
  <section class="panel stack">
    <h2>Dados da avaliação</h2>
    <div class="field"><label for="d-praga">Praga</label><div class="inp"><select id="d-praga" data-d="praga">${Object.entries(PRAGAS).filter(([,p])=>p.tipo==="praga").map(([k,p])=>`<option value="${k}" ${k===D.praga?"selected":""}>${p.nome}</option>`).join("")}</select></div></div>
    <div class="field"><span style="font-size:.875rem;font-weight:650">Estádio da soja</span><div class="seg" role="group" aria-label="Estádio da soja"><button aria-pressed="${D.estadio==="veg"}" data-est="veg">Vegetativo (V)</button><button aria-pressed="${D.estadio==="rep"}" data-est="rep">Reprodutivo (R)</button></div></div>
    ${inp("pop","População média","por pano","Média do pano de batida, só lagartas acima de 1,5 cm",.5)}
    <div class="grid2">${inp("areaAf","Área afetada","ha")}${inp("areaTotal","Área plantada","ha")}</div>
    <div class="grid2">${inp("preco","Preço da saca","R$")}${inp("prod","Produtividade","sc/ha")}</div>
    <div class="grid2">${inp("produto","Defensivo","R$/ha")}${inp("aplic","Aplicação","R$/ha")}</div>
    ${inp("oper","Máquinas e mão de obra","R$/ha")}
    <details><summary>Parâmetros técnicos</summary><div class="stack" style="margin-top:8px">
      ${inp("k","Perda por lagarta","% sc/ha","Quanto da produtividade cada lagarta por pano tira",.01)}
      ${inp("ef","Eficiência do controle","%")}${inp("cresc","Crescimento da população","% ao dia")}</div></details>
  </section></div>`;
};
V.alertas=()=>`<h1 style="margin-bottom:4px">Alertas</h1><p class="muted small" style="margin-bottom:14px">Cada alerta mostra o porquê técnico.</p>
  <div class="stack">${ALERTAS.map(a=>{const t=tal(a.talhao);return `<article class="panel" style="border-left:6px solid ${COLORS[a.nivel]}">
  <div class="row between" style="align-items:flex-start"><div><h3>${a.titulo}</h3><p class="xs muted">Fazenda Santa Rita, ${t.id} ${t.nome}, ${a.quando}</p></div><span class="st ${a.nivel}">${stLabel[a.nivel]}</span></div>
  <p class="small" style="margin-top:8px">${a.just}</p>
  <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sec" style="min-height:44px" data-open="${t.id}">Ver talhão</button>${a.nivel==="cr"?`<button class="btn pri" style="min-height:44px" data-simular="${t.praga}" data-t="${t.id}">Simular decisão</button>`:""}</div></article>`}).join("")}</div>`;
V.guia=()=>{
  const curve=[2,3,5,6,6,7,9,13,18,24,31,36];
  return `<h1 style="margin-bottom:4px">Guia do manejo integrado</h1><p class="muted small" style="margin-bottom:14px">Três níveis decidem se é hora de aplicar. Exemplo: lagarta-da-soja.</p>
  <div class="two"><section class="panel">
  ${lineChart([{n:"População",v:curve,c:"#235239"}],["","S1","","S3","","S5","","S7","","S9","","S11"],{nc:20,ne:6,max:40,h:200})}
  <p class="xs muted">Linha tracejada vermelha: nível de controle. Pontilhada verde: nível de equilíbrio. A população cruza o NC na semana 9: é ali que se aplica, antes do dano.</p></section>
  <section class="stack">
  <div class="panel" style="border-left:6px solid var(--broto)"><h3>Nível de equilíbrio (NE)</h3><p class="small" style="margin-top:4px">A população que normalmente vive na lavoura sem dar prejuízo, mantida por inimigos naturais e clima. Na soja, algumas lagartas por pano são esperadas e não justificam aplicação.</p></div>
  <div class="panel" style="border-left:6px solid var(--ambar)"><h3>Nível de controle (NC)</h3><p class="small" style="margin-top:4px">O ponto em que é preciso agir para a praga não chegar ao dano econômico. Para lagartas desfolhadoras, a Embrapa indica 20 lagartas grandes por pano de batida, ou 30% de desfolha no vegetativo e 15% no reprodutivo.</p></div>
  <div class="panel" style="border-left:6px solid var(--urucum)"><h3>Nível de dano econômico (NDE)</h3><p class="small" style="margin-top:4px">Quando o prejuízo da praga passa a ser maior que o custo de controlar. Depende do preço da saca e do custo da aplicação, por isso o app calcula com os seus números.</p>
  <p class="xs muted" style="margin-top:6px">NDE = custo do controle ÷ (preço × produtividade × perda por inseto × eficiência)</p></div>
  <button class="btn pri block" data-go="decisao">Calcular para o meu talhão</button></section></div>`;
};

/* ---------- DETALHE DO TALHÃO ---------- */
function openPlot(id){
  const t=tal(id),p=PRAGAS[t.praga];const dias=Math.round((new Date("2026-11-03")-new Date(t.plantio))/864e5);
  $("#sheet").innerHTML=`<div class="grab"></div><div class="row between"><h2 id="sheetTitle">${t.id} ${t.nome}</h2><button class="iconbtn" data-close aria-label="Fechar"><svg><use href="#i-x"/></svg></button></div>
  <div class="row" style="margin:6px 0 14px;gap:8px"><span class="st ${t.status}">${stLabel[t.status]}</span><span class="small muted">${t.ha} ha</span></div>
  <div class="stack">
  <div class="panel"><div class="scen" style="border:0;padding:0"><dl style="margin:0"><dt>Cultura</dt><dd>Soja</dd><dt>Variedade</dt><dd>${t.var}</dd><dt>Plantio</dt><dd>${t.plantio.split("-").reverse().join("/")} (${dias} dias)</dd><dt>Estádio atual</dt><dd>${t.estadio}</dd><dt>Última avaliação</dt><dd>03/11, 07:42</dd><dt>Clima</dt><dd>27 °C, 64% UR</dd></dl></div></div>
  <div class="panel"><h3 style="margin-bottom:6px">${p.nome}, ${p.tipo==="doenca"?"% folhas":"por pano"}</h3>${lineChart([{n:p.nome,v:t.hist,c:COLORS[t.status]}],DATAS,p.tipo==="doenca"?{max:5}:{nc:p.NC,ne:p.NE,max:28,h:150})}</div>
  <div class="panel"><h3 style="margin-bottom:6px">Histórico</h3>
  ${REGISTROS.filter(r=>r.talhao===id).map(r=>`<p class="small"><b>${r.data}</b> ${r.o}, ${r.q}</p>`).join("")||`<p class="small muted">Sem ocorrências nesta safra.</p>`}
  ${APLICACOES.filter(a=>a.talhao===id).map(a=>`<p class="small"><b>${a.data}</b> Aplicação: ${a.prod}</p>`).join("")}</div>
  ${p.tipo==="praga"?`<button class="btn pri block" data-simular="${t.praga}" data-t="${t.id}">Simular decisão para este talhão</button>`:`<button class="btn pri block" data-go="identificar">Fotografar folhas</button>`}
  </div>`;
  $("#sheet").classList.add("open");$("#scrim").classList.add("open");$("#sheet").querySelector("[data-close]").focus();
}
function closeSheet(){$("#sheet").classList.remove("open");$("#scrim").classList.remove("open")}

/* ---------- ROTAS ---------- */
let atual="inicio";
function go(r,{anim=true}={}){
  if(!V[r])r="inicio";atual=r;closeSheet();
  if(location.hash.slice(1)!==r)history.replaceState(null,"","#"+r);
  $("#view").innerHTML=V[r](anim);
  document.querySelectorAll("[data-go]").forEach(b=>{if(b.closest("nav"))b.toggleAttribute("aria-current",b.dataset.go===r);if(b.closest("nav")&&b.dataset.go===r)b.setAttribute("aria-current","page")});
  window.scrollTo(0,0);
  if(r==="decisao"&&anim)requestAnimationFrame(()=>requestAnimationFrame(animateGauge));
}
function animateGauge(){const c=calc(),m=$("#gmark");if(!m)return;const max=Math.max(40,c.NDE*1.3,D.pop*1.15);m.style.left=Math.min(100,D.pop/max*100)+"%"}
function refreshDecisao(){
  const f=document.activeElement&&document.activeElement.id;const pos=f&&document.activeElement.selectionStart;
  $("#view").innerHTML=V.decisao(false);
  if(f){const el=document.getElementById(f);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- EVENTOS ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const o=e.target.closest("[data-open]");if(o){openPlot(o.dataset.open);return}
  const pl=e.target.closest("[data-plot]");if(pl){mapSel=pl.dataset.plot;document.querySelectorAll(".plot").forEach(x=>x.classList.toggle("sel",x.dataset.plot===mapSel));$("#mapinfo").innerHTML=mapInfo();return}
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){closeSheet();return}
  const m=e.target.closest("[data-modo]");if(m){idState={modo:m.dataset.modo,fase:"pronto"};go("identificar");return}
  const a=e.target.closest("[data-amostra]");if(a){analisar(a.dataset.amostra,null);return}
  if(e.target.closest("[data-reset]")){idState={modo:idState.modo,fase:"pronto"};go("identificar");return}
  const rg=e.target.closest("[data-registrar]");if(rg){const r=resultado(idState.res);REGISTROS.unshift({data:"03/11",talhao:rg.dataset.registrar,o:r.nome,q:r.key==="ferrugem"?"1% folhas":r.key==="chrysodeixis"?"14/pano":"24/pano",est:r.est.split(",")[0]});pendentes++;updSync();toast(`Registrado no ${rg.dataset.registrar}. Sincroniza quando tiver sinal.`);return}
  const sm=e.target.closest("[data-simular]");if(sm){const t=tal(sm.dataset.t||(sm.dataset.simular==="chrysodeixis"?"T2":"T4"));D.praga=sm.dataset.simular;D.pop=t.pop;D.areaAf=t.ha;D.estadio=/^R/.test(t.estadio)?"rep":"veg";go("decisao");return}
  const es=e.target.closest("[data-est]");if(es){D.estadio=es.dataset.est;refreshDecisao();return}
  if(e.target.closest("#syncBtn")){if(pendentes){pendentes=0;updSync();toast("Registros sincronizados.")}return}
  if(e.target.closest("#addT")){toast("Cadastro de talhão: desenhe no mapa ou importe do GPS (próxima versão).")}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  const pl=e.target.closest&&e.target.closest("[data-plot]");if(pl&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pl.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.d;if(!k)return;
  if(k==="praga"){D.praga=e.target.value}else{const v=parseFloat(String(e.target.value).replace(",","."));if(isNaN(v)||v<0)return;D[k]=v}
  clearTimeout(window._dt);window._dt=setTimeout(refreshDecisao,k==="praga"?0:350)});
document.addEventListener("change",e=>{if(e.target.id==="foto"&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>analisar(idState.modo==="praga"?"anticarsia":"ferrugem",fr.result);fr.readAsDataURL(e.target.files[0])}});
function analisar(key,foto){idState.fase="analisando";idState.res=key;idState.foto=foto;go("identificar");setTimeout(()=>{if(atual!=="identificar")return;idState.fase="resultado";go("identificar")},1700)}
function updSync(){$("#syncTxt").textContent=pendentes?`${pendentes} para sincronizar`:"Tudo sincronizado";$("#syncBtn").classList.toggle("ok",!pendentes)}
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(r!==atual)go(r)});
go(location.hash.slice(1)||"inicio");
</script>
