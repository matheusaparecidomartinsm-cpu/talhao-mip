<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talhão — aplico ou não?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--mata:#173A2A;--mata2:#235239;--broto:#6FA83A;--ok-bg:#E3F0D6;--ok-tx:#3D6A1A;--ambar:#E0A02A;--at-bg:#FBEFD3;--at-tx:#865A07;--urucum:#C2402F;--cr-bg:#F8DDD8;--cr-tx:#9A2A1C;--nevoa:#EEF2EC;--linha:#D5DDD3;--tinta:#14211A;--tinta2:#4B5A50}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--nevoa);color:var(--tinta);line-height:1.5;font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{padding:20px 0 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-stretch:125%;font-weight:800;font-size:1.3rem;color:var(--mata);display:flex;gap:8px;align-items:center}
.brand svg{width:26px;height:26px;color:var(--broto)}
h1{font-stretch:118%;font-size:1.55rem;line-height:1.15;font-weight:780;letter-spacing:-.015em}
h2{font-stretch:115%;font-size:1.1rem;font-weight:740}
.muted{color:var(--tinta2)}.small{font-size:.875rem}
.card{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:16px}
.stack>*+*{margin-top:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.ok{background:var(--ok-bg);color:var(--ok-tx)}.at{background:var(--at-bg);color:var(--at-tx)}.cr{background:var(--cr-bg);color:var(--cr-tx)}.nd{background:var(--nevoa);color:var(--tinta2)}
/* talhões */
.plot{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--linha);border-radius:18px;padding:14px;min-height:76px;border-left:8px solid var(--linha)}
.plot.s-ok{border-left-color:var(--broto)}.plot.s-at{border-left-color:var(--ambar)}.plot.s-cr{border-left-color:var(--urucum)}
.plot .g{flex:1;min-width:0}.plot b{font-stretch:115%;font-size:1.05rem}
.plot+.plot{margin-top:10px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.summary div{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 12px}
.summary b{display:block;font-stretch:125%;font-size:1.45rem;font-weight:780;line-height:1.1}
.summary span{font-size:.78rem;color:var(--tinta2)}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:.9rem;font-weight:700}
.hint{font-size:.8rem;color:var(--tinta2)}
.inp{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--linha);border-radius:12px;min-height:50px;padding:0 12px}
.inp:focus-within{border-color:var(--mata2)}
.inp input,.inp select{border:0;outline:0;background:transparent;flex:1;min-width:0;width:100%;font-size:1rem;font-weight:600;height:48px}
.inp span{color:var(--tinta2);font-size:.85rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--linha);background:#fff;font-weight:650;font-size:.92rem;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--mata);border-color:var(--mata);color:#fff}
.points{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pt{background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:8px;text-align:center}
.pt small{font-size:.75rem;color:var(--tinta2);display:block}
.pt .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.pt .ctl button{width:34px;height:40px;border-radius:9px;background:var(--nevoa);font-weight:800;font-size:1.2rem}
.pt .ctl b{font-stretch:125%;font-size:1.3rem;font-variant-numeric:tabular-nums}
.btn{min-height:52px;border-radius:14px;padding:0 20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:1rem}
.pri{background:var(--mata);color:#fff}.pri:hover{background:var(--mata2)}
.sec{background:#fff;border:1.5px solid var(--mata);color:var(--mata)}
.add{border:1.5px dashed var(--mata2);color:var(--mata2);background:transparent}
/* resultado */
.verdict{border-radius:20px;padding:20px;color:#fff}
.verdict.v-cr{background:var(--urucum)}.verdict.v-at{background:var(--ambar);color:#2B1D02}.verdict.v-ok{background:var(--broto);color:#122708}
.verdict h1{color:inherit;font-size:1.8rem}
.verdict p{margin-top:6px}
.ruler{position:relative;padding:30px 0 34px}
.track{height:16px;border-radius:8px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.mark{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .9s cubic-bezier(.2,.8,.2,1)}
.mark span{background:var(--tinta);color:#fff;font-weight:750;font-size:.8rem;padding:2px 8px;border-radius:7px;white-space:nowrap;font-stretch:120%}
.mark i{width:3px;height:26px;background:var(--tinta)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--tinta2);text-align:center;white-space:nowrap;line-height:1.2}
.tick::before{content:"";display:block;width:2px;height:8px;margin:0 auto 2px;background:var(--tinta2)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money div{border-radius:14px;padding:12px;background:var(--nevoa)}
.money b{display:block;font-stretch:125%;font-size:1.3rem;font-weight:780}
.hist li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--linha);font-size:.92rem}
details summary{cursor:pointer;font-weight:700;color:var(--mata2);min-height:44px;display:flex;align-items:center}
.tip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tip div{background:var(--nevoa);border-radius:12px;padding:10px;font-size:.85rem}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--mata);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:grid;grid-template-columns:1fr 1fr 1fr;max-width:560px;width:100%}
nav button{color:#B9CDBE;font-size:.78rem;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px;justify-content:center}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:#fff}
nav button[aria-current="page"] svg{color:var(--broto)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,16px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.err{color:var(--cr-tx);font-size:.82rem;font-weight:600}
@media (prefers-reduced-motion:reduce){.mark{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 15-15-1 10-6 15-15 15z"/><path d="M5 19l8-8"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
</svg>

<div class="wrap">
  <header><div class="brand"><svg><use href="#i-leaf"/></svg>Talhão</div><span class="small muted" id="farm"></span></header>
  <main id="view"></main>
</div>
<nav aria-label="Navegação"><div class="in">
  <button data-go="talhoes"><svg><use href="#i-map"/></svg>Talhões</button>
  <button data-go="avaliar"><svg><use href="#i-plus"/></svg>Avaliar</button>
  <button data-go="custos"><svg><use href="#i-gear"/></svg>Custos</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* Referências técnicas (Embrapa, Tecnologias de Produção de Soja) */
const PRAGAS={
  lagarta:{nome:"Lagarta-da-soja",unid:"lagartas grandes por pano",dica:"Conte só lagartas com mais de 1,5 cm.",nc:{V:20,R:20},ne:6,k:.0009},
  falsa:{nome:"Falsa-medideira",unid:"lagartas grandes por pano",dica:"Conte só lagartas com mais de 1,5 cm.",nc:{V:20,R:20},ne:6,k:.0009},
  percevejo:{nome:"Percevejo-marrom",unid:"percevejos por pano",dica:"Conte adultos e ninfas com mais de 0,5 cm. Só faz sentido a partir de R3.",nc:{V:2,R:2},ne:.5,k:.012}
};
const DESF={V:30,R:15};

/* ---------- estado (fica salvo neste aparelho) ---------- */
const PADRAO={fazenda:"Fazenda Santa Rita",
  custos:{preco:128,prod:62,aplicacao:165},
  talhoes:[{id:1,nome:"Sede",ha:42},{id:2,nome:"Baixada",ha:38},{id:3,nome:"Açude",ha:31},{id:4,nome:"Estrada",ha:47}],
  avaliacoes:[
    {t:3,data:"2026-11-03",praga:"lagarta",est:"V",pontos:[22,26,25,21,26],desf:18},
    {t:2,data:"2026-11-02",praga:"falsa",est:"V",pontos:[12,16,14,13],desf:10},
    {t:1,data:"2026-11-01",praga:"lagarta",est:"V",pontos:[2,4,3,3],desf:5},
    {t:3,data:"2026-10-27",praga:"lagarta",est:"V",pontos:[18,20,19,19,19],desf:12}
  ]};
let S;
try{S=JSON.parse(localStorage.getItem("talhao-v2"))}catch(e){}
if(!S||!S.talhoes)S=structuredClone(PADRAO);
function salvar(){try{localStorage.setItem("talhao-v2",JSON.stringify(S))}catch(e){}}

/* ---------- regras ---------- */
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const fmt=(v,d=1)=>v.toLocaleString("pt-BR",{maximumFractionDigits:d});
function avaliar(a){
  const p=PRAGAS[a.praga],t=S.talhoes.find(x=>x.id===a.t)||{ha:0};
  const media=a.pontos.reduce((s,v)=>s+v,0)/a.pontos.length;
  const nc=p.nc[a.est],lim=DESF[a.est];
  const desfAcima=a.praga!=="percevejo"&&a.desf>=lim;
  let nivel,titulo,texto;
  if(media>=nc||desfAcima){nivel="cr";titulo="Aplicar";
    texto=desfAcima&&media<nc?`A desfolha (${a.desf}%) passou do limite de ${lim}% para o estádio ${a.est==="V"?"vegetativo":"reprodutivo"}.`:`Média de ${fmt(media)} ${p.unid}. O nível de controle é ${nc}.`}
  else if(media>=nc*.6||(a.praga!=="percevejo"&&a.desf>=lim*.7)){nivel="at";titulo="Ainda não. Volte em 3 dias";
    texto=`Média de ${fmt(media)}, ${Math.round(media/nc*100)}% do nível de controle. A população pode passar do limite logo.`}
  else{nivel="ok";titulo="Não aplicar";texto=`Média de ${fmt(media)}, bem abaixo do nível de controle (${nc}). Aplicar agora seria gasto sem retorno.`}
  const c=S.custos;
  const custo=c.aplicacao*t.ha;
  const perda=c.prod*c.preco*t.ha*Math.min(media*1.6*p.k,.6); // projeção de 7 dias sem controle
  return {media,nc,ne:p.ne,nivel,titulo,texto,custo,perda,p,t};
}
function ultima(id){return S.avaliacoes.filter(a=>a.t===id).sort((a,b)=>b.data.localeCompare(a.data))[0]}
const rotulo={ok:"Tranquilo",at:"Atenção",cr:"Aplicar",nd:"Sem avaliação"};
const dataBR=d=>d.split("-").reverse().slice(0,2).join("/");

/* ---------- telas ---------- */
const $=s=>document.querySelector(s);
let rascunho=null,resultado=null;
const V={};
V.talhoes=()=>{
  const st=S.talhoes.map(t=>{const u=ultima(t.id);return {t,u,r:u&&avaliar(u)}});
  const n=k=>st.filter(x=>(x.r?x.r.nivel:"nd")===k).length;
  return `<h1>${n("cr")?`${n("cr")} talhão${n("cr")>1?"es precisam":" precisa"} de aplicação`:"Nenhum talhão precisa de aplicação"}</h1>
  <div class="summary"><div><b style="color:var(--cr-tx)">${n("cr")}</b><span>aplicar</span></div><div><b style="color:var(--at-tx)">${n("at")}</b><span>atenção</span></div><div><b style="color:var(--ok-tx)">${n("ok")}</b><span>tranquilos</span></div></div>
  ${st.map(({t,u,r})=>{const k=r?r.nivel:"nd";return `<button class="plot s-${k}" data-avaliar="${t.id}">
    <span class="g"><b>${t.nome}</b> <span class="small muted">${t.ha} ha</span><br>
    <span class="small muted">${u?`${r.p.nome}: ${fmt(r.media)} por pano, em ${dataBR(u.data)}`:"Toque para fazer a primeira avaliação"}</span></span>
    <span class="st ${k}">${rotulo[k]}</span></button>`}).join("")}
  <div class="card stack" style="margin-top:16px" id="novoT" hidden>
    <h2>Novo talhão</h2>
    <div class="field"><label for="tn">Nome</label><div class="inp"><input id="tn" placeholder="Ex.: Cerca Viva" autocomplete="off"></div></div>
    <div class="field"><label for="th">Área</label><div class="inp"><input id="th" type="number" inputmode="decimal" min="0"><span>ha</span></div></div>
    <p class="err" id="terr" hidden></p>
    <button class="btn pri" id="salvarT">Salvar talhão</button>
  </div>
  <button class="btn add" style="margin-top:16px" id="abrirT">Adicionar talhão</button>`;
};
V.avaliar=()=>{
  if(resultado)return V.resultado();
  if(!rascunho)rascunho={t:S.talhoes[0]?.id,praga:"lagarta",est:"V",pontos:[0,0,0],desf:0,data:new Date().toISOString().slice(0,10)};
  const r=rascunho,p=PRAGAS[r.praga],t=S.talhoes.find(x=>x.id===r.t);
  const sug=t?Math.max(3,Math.ceil(t.ha/10)):3;
  return `<h1>Nova avaliação</h1><p class="muted small" style="margin:4px 0 16px">Faça o pano de batida em vários pontos do talhão e anote quantas caíram em cada um.</p>
  <div class="stack">
  <div class="field"><label for="sel-t">Talhão</label><div class="inp"><select id="sel-t">${S.talhoes.map(x=>`<option value="${x.id}" ${x.id===r.t?"selected":""}>${x.nome} (${x.ha} ha)</option>`).join("")}</select></div></div>
  <div class="field"><span class="lab">Praga</span><div class="seg">${Object.entries(PRAGAS).map(([k,v])=>`<button aria-pressed="${k===r.praga}" data-praga="${k}">${v.nome}</button>`).join("")}</div>
  ${r.praga!=="percevejo"?`<details><summary>Lagarta-da-soja ou falsa-medideira?</summary><div class="tip"><div><b>Lagarta-da-soja</b><br>Listras brancas no dorso. Anda normal e se debate quando tocada.</div><div><b>Falsa-medideira</b><br>Verde-clara, afina na cabeça. Anda "medindo palmo" e deixa a folha rendada.</div></div></details>`:""}</div>
  <div class="field"><span class="lab">Estádio da soja</span><div class="seg"><button aria-pressed="${r.est==="V"}" data-est="V">Vegetativo (V)</button><button aria-pressed="${r.est==="R"}" data-est="R">Reprodutivo (R)</button></div></div>
  <div class="field"><span class="lab">Contagem por ponto</span><span class="hint">${p.dica} Recomendado: ${sug} pontos neste talhão.</span>
    <div class="points">${r.pontos.map((v,i)=>`<div class="pt"><small>Ponto ${i+1}</small><div class="ctl"><button data-menos="${i}" aria-label="Diminuir ponto ${i+1}">−</button><b>${v}</b><button data-mais="${i}" aria-label="Aumentar ponto ${i+1}">+</button></div></div>`).join("")}</div>
    <div class="seg" style="margin-top:4px"><button data-addpt>Adicionar ponto</button>${r.pontos.length>1?`<button data-rmpt>Remover último</button>`:""}</div></div>
  ${r.praga!=="percevejo"?`<div class="field"><label for="desf">Desfolha estimada</label><div class="inp"><input id="desf" type="number" inputmode="numeric" min="0" max="100" value="${r.desf}"><span>%</span></div><span class="hint">Limite: ${DESF[r.est]}% no estádio ${r.est==="V"?"vegetativo":"reprodutivo"}.</span></div>`:""}
  <button class="btn pri" id="ver" ${t?"":"disabled"}>Ver resultado</button>
  ${t?"":`<p class="err">Cadastre um talhão primeiro.</p>`}
  </div>`;
};
V.resultado=()=>{
  const r=avaliar(resultado);
  const max=Math.max(r.nc*2,r.media*1.15);const pc=v=>Math.min(100,v/max*100);
  return `<div class="stack">
  <div class="verdict v-${r.nivel}"><p class="small" style="margin:0 0 4px;opacity:.9">${r.t.nome}, ${r.p.nome}</p><h1>${r.titulo}</h1><p>${r.texto}</p></div>
  <div class="card"><h2>Onde está a praga</h2><p class="small muted">${r.p.unid}</p>
    <div class="ruler"><div class="mark" id="mark" style="left:0%"><span>${fmt(r.media)} hoje</span><i></i></div>
    <div class="track"><i style="width:${pc(r.ne)}%;background:#A6CF7D"></i><i style="width:${pc(r.nc)-pc(r.ne)}%;background:#E8C26A"></i><i style="flex:1;background:#D9604A"></i></div>
    <span class="tick" style="left:${pc(r.ne)}%">Normal<br>${fmt(r.ne)}</span><span class="tick" style="left:${pc(r.nc)}%">Controle<br>${r.nc}</span></div>
    <p class="small muted">Até o nível normal, inimigos naturais seguram a praga. Passou do nível de controle, aplique antes que o prejuízo supere o custo.</p></div>
  <div class="card"><h2 style="margin-bottom:10px">Na ponta do lápis</h2>
    <div class="money"><div><span class="small muted">Aplicar custa</span><b>${brl(r.custo)}</b><span class="small muted">${r.t.ha} ha</span></div>
    <div><span class="small muted">Não aplicar pode custar</span><b style="color:${r.perda>r.custo?"var(--cr-tx)":"var(--ok-tx)"}">${brl(r.perda)}</b><span class="small muted">em 7 dias</span></div></div>
    <p class="small muted" style="margin-top:8px">${r.perda>r.custo?"A perda estimada já é maior que o custo da aplicação.":"Por enquanto a perda estimada é menor que o custo de aplicar."} Ajuste preços na aba Custos.</p></div>
  <button class="btn pri" id="salvarA">Salvar avaliação</button>
  <button class="btn sec" id="editar">Corrigir contagem</button>
  </div>`;
};
V.custos=()=>{const c=S.custos;
  const hist=S.avaliacoes.slice().sort((a,b)=>b.data.localeCompare(a.data));
  return `<h1>Custos</h1><p class="muted small" style="margin:4px 0 16px">Usados para comparar o custo de aplicar com o prejuízo da praga.</p>
  <div class="card stack">
  <div class="field"><label for="c-preco">Preço da saca</label><div class="inp"><span>R$</span><input id="c-preco" data-c="preco" type="number" inputmode="decimal" value="${c.preco}"></div></div>
  <div class="field"><label for="c-prod">Produtividade esperada</label><div class="inp"><input id="c-prod" data-c="prod" type="number" inputmode="decimal" value="${c.prod}"><span>sc/ha</span></div></div>
  <div class="field"><label for="c-ap">Custo total de uma aplicação</label><div class="inp"><span>R$</span><input id="c-ap" data-c="aplicacao" type="number" inputmode="decimal" value="${c.aplicacao}"><span>/ha</span></div><span class="hint">Produto, máquina, combustível e mão de obra.</span></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Histórico</h2><ul class="hist" style="margin-top:8px">
  ${hist.length?hist.map(a=>{const r=avaliar(a);return `<li><span><b>${dataBR(a.data)}</b> ${r.t.nome||"?"}, ${r.p.nome}</span><span class="st ${r.nivel}">${fmt(r.media)}</span></li>`}).join(""):`<li class="muted">Nenhuma avaliação ainda.</li>`}</ul></div>
  <button class="btn sec" style="margin-top:16px" id="reset">Voltar aos dados de exemplo</button>`;
};

/* ---------- navegação ---------- */
let atual="talhoes";
function go(r){if(!V[r])r="talhoes";atual=r;if(location.hash.slice(1)!==r)history.replaceState(null,"","#"+r);
  $("#view").innerHTML=V[r]();$("#farm").textContent=S.fazenda;
  document.querySelectorAll("nav button").forEach(b=>b.dataset.go===r?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  if(r==="avaliar"&&resultado)requestAnimationFrame(()=>requestAnimationFrame(()=>{const m=$("#mark");if(!m)return;const x=avaliar(resultado);const max=Math.max(x.nc*2,x.media*1.15);m.style.left=Math.max(8,Math.min(94,x.media/max*100))+"%"}));
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.go){if(d.go==="avaliar"&&atual!=="avaliar"){resultado=null}go(d.go);window.scrollTo(0,0);return}
  if(d.avaliar){resultado=null;rascunho=null;go("avaliar");rascunho.t=+d.avaliar;const u=ultima(+d.avaliar);if(u){rascunho.praga=u.praga;rascunho.est=u.est}go("avaliar");return}
  if(d.praga){rascunho.praga=d.praga;go("avaliar");return}
  if(d.est){rascunho.est=d.est;go("avaliar");return}
  if(d.mais){rascunho.pontos[+d.mais]++;go("avaliar");return}
  if(d.menos){rascunho.pontos[+d.menos]=Math.max(0,rascunho.pontos[+d.menos]-1);go("avaliar");return}
  if("addpt" in d){rascunho.pontos.push(0);go("avaliar");return}
  if("rmpt" in d){rascunho.pontos.pop();go("avaliar");return}
  if(b.id==="ver"){resultado={...rascunho,pontos:[...rascunho.pontos]};go("avaliar");window.scrollTo(0,0);return}
  if(b.id==="editar"){resultado=null;go("avaliar");return}
  if(b.id==="salvarA"){S.avaliacoes.push(resultado);salvar();const n=S.talhoes.find(x=>x.id===resultado.t).nome;resultado=null;rascunho=null;go("talhoes");toast(`Avaliação do ${n} salva.`);return}
  if(b.id==="abrirT"){$("#novoT").hidden=false;b.hidden=true;$("#tn").focus();return}
  if(b.id==="salvarT"){const n=$("#tn").value.trim(),h=parseFloat($("#th").value);const er=$("#terr");
    if(!n||!(h>0)){er.hidden=false;er.textContent=!n?"Dê um nome ao talhão.":"Informe a área em hectares.";return}
    S.talhoes.push({id:Math.max(0,...S.talhoes.map(x=>x.id))+1,nome:n,ha:h});salvar();go("talhoes");toast(`Talhão ${n} adicionado.`);return}
  if(b.id==="reset"){S=structuredClone(PADRAO);salvar();rascunho=null;resultado=null;go("custos");toast("Dados de exemplo restaurados.")}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sel-t"){rascunho.t=+e.target.value;go("avaliar")}
});
document.addEventListener("input",e=>{
  if(e.target.id==="desf"){rascunho.desf=Math.min(100,Math.max(0,+e.target.value||0))}
  const k=e.target.dataset.c;if(k){const v=parseFloat(e.target.value);if(v>=0){S.custos[k]=v;salvar()}}
});
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(r!==atual)go(r)});
go(location.hash.slice(1)||"talhoes");
</script>
</body>
</html>
