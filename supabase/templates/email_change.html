<h2 style="font-family:Arial,sans-serif;color:#2B1E45">Confirme seu e-mail no Glyma</h2>
<p style="font-family:Arial,sans-serif;color:#1C1923">Use este código para ligar este e-mail à sua conta. Seus diagnósticos continuam com você.</p>
<p style="font-family:Arial,sans-serif;font-size:32px;letter-spacing:8px;font-weight:bold;color:#2B1E45">{{ .Token }}</p>
<p style="font-family:Arial,sans-serif;color:#4E4858">Ou toque no link: <a href="{{ .ConfirmationURL }}" style="color:#5B3A9E">entrar no Glyma</a>.</p>
<p style="font-family:Arial,sans-serif;color:#4E4858;font-size:13px">O código vale por 1 hora. Se não foi você que pediu, pode ignorar este e-mail.</p>
