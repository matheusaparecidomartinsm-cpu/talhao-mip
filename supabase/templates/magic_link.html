<h2 style="font-family:Arial,sans-serif;color:#173A2A">Seu código do Talhão</h2>
<p style="font-family:Arial,sans-serif;color:#14211A">Use este código para entrar:</p>
<p style="font-family:Arial,sans-serif;font-size:32px;letter-spacing:8px;font-weight:bold;color:#173A2A">{{ .Token }}</p>
<p style="font-family:Arial,sans-serif;color:#4B5A50">Ou toque no link: <a href="{{ .ConfirmationURL }}" style="color:#3A721A">entrar no Talhão</a>.</p>
<p style="font-family:Arial,sans-serif;color:#4B5A50;font-size:13px">O código vale por 1 hora. Se não foi você que pediu, pode ignorar este e-mail.</p>
